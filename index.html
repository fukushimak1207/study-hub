<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5a3f8f">
<title>学びハブ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>学びハブ</h1>
  <button id="reload" class="icon-btn" type="button" aria-label="最新にする">↻</button>
</header>

<div id="banner" class="banner" hidden></div>

<main>
  <section id="tab-home" class="tab"></section>
  <section id="tab-seminars" class="tab" hidden></section>
  <section id="tab-papers" class="tab" hidden></section>
  <section id="tab-settings" class="tab" hidden>
    <h2>設定</h2>
    <form id="conf-form" class="card form">
      <label for="conf-url">サーバーの URL</label>
      <input id="conf-url" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec">
      <label for="conf-token">合言葉</label>
      <input id="conf-token" type="password" autocomplete="off">
      <button type="submit" class="primary">保存してつなぐ</button>
      <p id="conf-msg" class="small"></p>
    </form>
    <div class="card small">
      <p>URL と合言葉はこの端末の中にだけ保存されます。機種変更のときは入れ直してください。</p>
      <p>最終取得: <span id="fetched-at">まだありません</span></p>
    </div>
    <div class="card small">
      <p>データの入り方</p>
      <ul>
        <li>勉強会: 毎週月曜の巡回で Claude が追記します</li>
        <li>論文: 毎週日曜に論文ウォッチャーが追記します</li>
        <li>メモ欄を含め、患者情報は入れないでください</li>
      </ul>
    </div>
  </section>
</main>

<div id="reg-sheet" class="sheet" hidden>
  <form id="reg-form" class="sheet-body" aria-labelledby="reg-head">
    <h2 id="reg-head">カレンダー・Tasks に登録</h2>
    <p id="reg-src" class="small"></p>
    <p id="reg-warn" class="small warn"></p>
    <label for="reg-title">タイトル</label>
    <input id="reg-title" type="text" autocomplete="off">
    <label for="reg-date">開催日</label>
    <input id="reg-date" type="date">
    <div class="grid2">
      <div><label for="reg-start">開始</label><input id="reg-start" type="time"></div>
      <div><label for="reg-end">終了</label><input id="reg-end" type="time"></div>
    </div>
    <p class="small">開始を空欄にすると終日の予定になります</p>
    <label for="reg-place">場所</label>
    <input id="reg-place" type="text" autocomplete="off">
    <label class="check"><input id="reg-cal" type="checkbox"> Google カレンダーに入れる</label>
    <label class="check"><input id="reg-task" type="checkbox"> Tasks「研修会・学会」に入れる</label>
    <div class="grid2">
      <div><label for="reg-due">Tasks の期限</label><input id="reg-due" type="date"></div>
      <div><label for="reg-note">Tasks のメモ</label><input id="reg-note" type="text" autocomplete="off"></div>
    </div>
    <p id="reg-msg" class="small" role="status"></p>
    <div class="sheet-actions">
      <button id="reg-cancel" type="button" class="ghost">閉じる</button>
      <button id="reg-go" type="submit" class="primary">登録する</button>
    </div>
  </form>
</div>

<nav class="tabs">
  <button type="button" data-tab="home" class="on">ホーム</button>
  <button type="button" data-tab="seminars">勉強会</button>
  <button type="button" data-tab="papers">論文</button>
  <button type="button" data-tab="settings">設定</button>
</nav>

<script src="app.js"></script>
</body>
</html>
